version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tms_postgres
    restart: always
    environment:
      POSTGRES_USER: tms_user
      POSTGRES_PASSWORD: tms_password
      POSTGRES_DB: tms_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: tms_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://tms_user:tms_password@postgres:5432/tms_database?schema=public
      - JWT_SECRET=super_secret_local_dev_key_123!
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: tms_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  postgres_data: