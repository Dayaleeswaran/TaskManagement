version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tms_postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tms_dev_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: tms_backend_api
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/tms_dev_db?schema=public"
      JWT_SECRET: "super-secret-key-change-me"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: tms_frontend_ui
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata: