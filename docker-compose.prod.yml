version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tms_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: production_password_change_me
      POSTGRES_DB: tms_prod_db
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tms_prod_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: tms_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:production_password_change_me@postgres:5432/tms_prod_db?schema=public"
      JWT_SECRET: "production-jwt-super-secret-key-change-me"
      JWT_EXPIRES_IN: "24h"
      CLIENT_ORIGIN: "http://localhost,http://localhost:80"
      SUPABASE_URL: "https://fyqskrbxrqrxmlwnzxrr.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5cXNrcmJ4cnFyeG1sd256eHJyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MTE1OTg4OCwiZXhwIjoyMDk2NzM1ODg4fQ.F8ZMhSJBtaTcpX1G9XjmsLHnxIf3z5QtJtUANjeirNI"
      SUPABASE_BUCKET: "Attachment"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:3000/api/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
        VITE_SOCKET_URL: ""
    container_name: tms_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata_prod:
