name: Continuous Deployment (Azure)

on:
  push:
    branches:
      - main  # Deploy on merge/push to main branch (Production)
      # - dev   # Uncomment if you want automatic deployment for staging too

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Run Verification & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify Backend Compilation & Lint
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run lint --if-present

      - name: Verify Frontend Compilation
        run: |
          cd frontend
          npm ci
          npm run build

