user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream backend service (references the Docker Compose backend service container)
    upstream backend_server {
        server backend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Frontend SPA routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets built by Vite (e.g. assets/index-hash.js)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
            access_log off;
        }

        # Cache common media assets
        location ~* \.(?:ico|gif|jpe?g|png|svg|woff2?|eot|ttf)$ {
            expires 6M;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Reverse proxy for REST API requests
        location /api/ {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            
            # HTTP headers for upstream forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API connection timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Reverse proxy for Socket.io WebSocket connections
        location /socket.io/ {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            
            # WebSocket HTTP Upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            # HTTP headers for upstream forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket session timeouts (long-lived connections)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
