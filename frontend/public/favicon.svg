<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="none" viewBox="0 0 100 100">
  <defs>
    <!-- Glowing Radial Background -->
    <radialGradient id="glowGradient" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Nest Twigs Gradient - Vibrant Indigo to Fuchsia -->
    <linearGradient id="nestGradient" x1="15" y1="50" x2="85" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Main Leaf Gradient - Modern Cyan to Emerald -->
    <linearGradient id="leafGradient" x1="30" y1="20" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Background Leaf Gradient - Soft Purple/Indigo -->
    <linearGradient id="leafBackGradient" x1="20" y1="20" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- 1. Subtle Glow Layer -->
  <circle cx="50" cy="55" r="35" fill="url(#glowGradient)" />

  <!-- 2. Nest Twigs (Cradling the growth) -->
  <g id="wn-nest-twigs">
    <!-- Outer Nest Branch -->
    <path
      d="M 15 50 C 15 80, 85 80, 85 50"
      stroke="url(#nestGradient)"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Middle Nest Branch -->
    <path
      d="M 24 57 C 29 79, 71 79, 76 57"
      stroke="url(#nestGradient)"
      stroke-width="4.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Inner Nest Branch -->
    <path
      d="M 33 64 C 38 78, 62 78, 67 64"
      stroke="url(#nestGradient)"
      stroke-width="3.2"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- 3. Sprouting Leaves on the Nest -->
  <g id="wn-nest-sprouts">
    <!-- Left Sprout Leaf -->
    <path
      d="M 15 50 C 10 44, 8 36, 17 38 C 22 39, 20 46, 15 50 Z"
      fill="url(#leafGradient)"
    />
    <!-- Right Sprout Leaf -->
    <path
      d="M 85 50 C 90 44, 92 36, 83 38 C 78 39, 80 46, 85 50 Z"
      fill="url(#leafGradient)"
    />
  </g>

  <!-- 4. Layered Growth Leaves -->
  <!-- Background Leaf -->
  <path
    d="M 32 58 C 26 45, 32 28, 48 22 C 64 16, 67 26, 62 40 C 57 54, 44 64, 32 58 Z"
    fill="url(#leafBackGradient)"
    opacity="0.6"
  />

  <!-- Foreground Main Leaf -->
  <path
    d="M 35 65 C 28 50, 35 30, 55 22 C 75 14, 78 28, 72 45 C 66 62, 50 72, 35 65 Z"
    fill="url(#leafGradient)"
  />

  <!-- 5. Central Checkmark (Work / Accomplishment) -->
  <path
    d="M 43 46 L 50 53 L 63 36"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>